<html>
  <head>
    <title>Connect 4 Game</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="index.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="App">
      <header>CONNECT 4</header>
      <div id="board" class="board"></div>
      <div id="columnSelector" class="columnSelector"></div>
      <div class="players">
        <input
          id="player1"
          class="red"
          type="text"
          maxlength="10"
          value="Player 1"
        />
        <input
          id="player2"
          class="yellow"
          type="text"
          maxlength="10"
          value="Player 2"
        />
      </div>
    </div>
    <div id="gameOverPanel" class="gameOverPanel hidden">
      <div class="gameOverMessage">
        <p id="winner"></p>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
